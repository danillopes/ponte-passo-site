<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponte Pênsil Mampituba</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Modelo 3D paramétrico da Ponte Pênsil Torres (RS) – Passo de Torres (SC) com simulador luminotécnico LED: focos, cor, potência, nits, lux no piso e mapa de falsa cor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: palco 3D em tela cheia + painel técnico lateral (folha inferior no celular) */
:root {
  --ink: #0a0d14;        /* fundo da cena / página */
  --panel: #10151f;      /* painel */
  --panel-2: #161d2a;    /* campos e cartões */
  --line: #233042;       /* divisórias */
  --fg: #e3e9f0;         /* texto */
  --muted: #8a97a9;      /* texto secundário */
  --led: #ffb54a;        /* acento: luz quente / ativo */
  --river: #4fa3ff;      /* acento secundário: azul Mampituba */
  --ok: #3fcf8e; --warn: #ffcc4d; --bad: #ff6b5b;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --panel-w: 380px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--fg); font: 14px/1.45 var(--f-body); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }

#app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr var(--panel-w); grid-template-rows: 52px 1fr; }
header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line); background: var(--panel); z-index: 5; min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 700 19px/1 var(--f-display); letter-spacing: 0.01em; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand i { font-style: normal; color: var(--led); }
nav.links { margin-left: auto; display: flex; gap: 6px; }
nav.links a { color: var(--fg); text-decoration: none; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; white-space: nowrap; }
nav.links a:hover { border-color: var(--led); color: var(--led); }

#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.dim { font: 500 11.5px/1.2 var(--f-mono); color: #fff; background: rgba(10,13,20,0.78); border: 1px solid rgba(255,181,74,0.6); padding: 3px 6px; border-radius: 4px; white-space: nowrap; }

/* HUD */
.hud { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 24px); pointer-events: none; }
.chip { background: rgba(16,21,31,0.86); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: 500 12px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; backdrop-filter: blur(6px); }
.chip small { display: block; font: 600 9.5px/1.2 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.chip.ok { border-color: color-mix(in srgb, var(--ok) 60%, var(--line)); }
.chip.no { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); }
.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--led); color: #1b1203; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,0.4); max-width: calc(100% - 32px); text-align: center; }
.coord { position: absolute; right: 12px; top: 12px; pointer-events: none; }
.legend { position: absolute; right: 12px; bottom: 12px; width: 230px; pointer-events: none; }
.legend .bar { height: 10px; border-radius: 3px; margin: 4px 0 3px; }
.legend .ticks { display: flex; justify-content: space-between; font: 10px var(--f-mono); color: var(--muted); }
.views { position: absolute; left: 12px; top: 12px; display: flex; gap: 4px; flex-wrap: wrap; max-width: calc(100% - 200px); }
.views button { background: rgba(16,21,31,0.82); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; backdrop-filter: blur(6px); }
.views button:hover { border-color: var(--led); }

/* Painel */
aside.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; z-index: 4; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 12px 4px 10px; font: 600 13px/1 var(--f-display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--led); }
.pane { overflow-y: auto; padding: 14px 16px 28px; display: none; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.pane.on { display: flex; }
.pane > *, .gbody > * { flex-shrink: 0; }
h3 { font: 700 13px/1.2 var(--f-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
.row label { font-size: 13px; }
.row output, .val { font: 12px var(--f-mono); color: var(--fg); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.field .lab b { color: var(--fg); font: 500 12px var(--f-mono); font-weight: 500; }
input[type="range"] { width: 100%; accent-color: var(--led); }
select, input[type="number"], input[type="text"] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; width: 100%; }
input[type="number"] { font-family: var(--f-mono); font-size: 12.5px; }
input[type="color"] { width: 38px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { background: var(--panel-2); border: 0; padding: 8px 4px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--led) 18%, var(--panel-2)); color: var(--fg); }
.switch { position: relative; width: 36px; height: 20px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 20px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); transition: transform .15s; }
.switch input:checked + span { background: var(--led); }
.switch input:checked + span::after { transform: translateX(16px); background: #1b1203; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; cursor: pointer; font-size: 13px; text-align: center; }
.btn:hover { border-color: var(--led); }
.btn.primary { background: var(--led); color: #1b1203; border-color: var(--led); font-weight: 600; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.note b { color: var(--fg); font-weight: 600; }

/* Grupos de luminárias */
.group { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.group.open { border-color: color-mix(in srgb, var(--led) 45%, var(--line)); }
.ghead { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; cursor: pointer; }
.swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); flex: none; }
.gtitle { min-width: 0; }
.gtitle b { display: block; font: 600 14px/1.2 var(--f-display); letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gtitle small { color: var(--muted); font: 11px var(--f-mono); }
.gbody { border-top: 1px solid var(--line); padding: 12px 10px 14px; display: flex; flex-direction: column; gap: 12px; }
.spec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.spec div { background: var(--panel); padding: 6px 7px; }
.spec small { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.spec span { font: 500 12px var(--f-mono); font-variant-numeric: tabular-nums; }
.swatches { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.swatches button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); cursor: pointer; padding: 0; }
.cct-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #ff8a1f, #ffb35c, #ffd9a8, #fff3e6, #f3f6ff, #d6e3ff); }
.pair { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: center; }

table.qt { width: 100%; border-collapse: collapse; font-size: 12px; }
table.qt th, table.qt td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
table.qt th:first-child, table.qt td:first-child { text-align: left; }
table.qt th { font-weight: 600; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; }
.tblwrap { overflow-x: auto; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--panel-2); }
.kpi small { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.kpi b { font: 600 20px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi b em { font-style: normal; font-size: 12px; color: var(--muted); margin-left: 3px; }
.pill { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.pill.ok { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
.pill.no { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
#sheetToggle { display: none; }

@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 48px 1fr auto; }
  aside.panel { position: relative; border-left: 0; border-top: 1px solid var(--line); height: 46vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
  aside.panel.min { height: 44px; }
  aside.panel.min .pane { display: none; }
  #sheetToggle { display: block; position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: -44px; z-index: 6; padding: 6px 12px; background: var(--panel); }
  .brand span { display: none; }
  .brand b { font-size: 16px; }
  .hide-sm { display: none; }
  .hud .chip:nth-child(4) { display: none; }
  .chip { padding: 5px 7px; font-size: 11px; }
  nav.links a { padding: 5px 8px; font-size: 12px; }
  .legend { width: 170px; bottom: 60px; }
  .views { max-width: calc(100% - 24px); }
  .coord { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><b>Ponte Pênsil <i>·</i> Mampituba</b><span>Torres (RS) ↔ Passo de Torres (SC) — modelo 3D paramétrico e estudo luminotécnico</span></div>
    <nav class="links"><a href="guia.html">Memorial técnico</a><a class="hide-sm" href="blender/ponte_pensil_blender.py" download>Script Blender</a></nav>
  </header>

  <main id="stage" aria-label="Visualização 3D da ponte">
    <div id="labels"></div>
    <div class="views" id="views"></div>
    <div class="chip coord" id="coord" hidden></div>
    <div class="hud" id="hud"></div>
    <div class="chip legend" id="legend" hidden>
      <small>Iluminância horizontal no piso (lx)</small>
      <div class="bar" id="legendBar"></div>
      <div class="ticks"><span>0</span><span>1</span><span>2</span><span>5</span><span>10</span><span>20</span><span>50</span><span>100</span></div>
    </div>
    <div class="toast" id="toast" hidden></div>
  </main>

  <aside class="panel" id="panel">
    <button class="btn" id="sheetToggle" aria-label="Recolher painel">▾</button>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="cena">Cena</button>
      <button role="tab" aria-selected="false" data-tab="luz">Luminárias</button>
      <button role="tab" aria-selected="false" data-tab="calc">Cálculo</button>
      <button role="tab" aria-selected="false" data-tab="arq">Arquivo</button>
    </div>
    <section class="pane on" id="pane-cena"></section>
    <section class="pane" id="pane-luz"></section>
    <section class="pane" id="pane-calc"></section>
    <section class="pane" id="pane-arq"></section>
  </aside>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
